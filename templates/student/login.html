{% extends "base.html" %}{% block title %}Student Login{% endblock %}{% block content %}<main class="container py-5"><div class="col-md-6 col-lg-5 mx-auto card shadow-sm"><div class="card-body p-4"><h2>Student Login</h2>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Login</button></form><div class="text-center mt-3"><a href="{{ url_for('student_registration.register') }}">Register as a student</a></div></div></div></main>{% endblock %}
