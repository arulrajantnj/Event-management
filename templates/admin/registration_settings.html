{% extends "admin/admin_base.html" %}{% block title %}Registration Settings{% endblock %}{% block content %}<div class="topbar"><h3>Registration Settings</h3><p class="mb-0 text-muted">Choose which standard fields appear on student registration.</p></div><form method="post" class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Field</th><th>Enabled</th><th>Mandatory</th><th>Order</th></tr></thead><tbody>{% for field in fields %}<tr><td>{{ field.field_label }}</td><td><input type="checkbox" name="enabled_{{ field.id }}" {% if field.enabled %}checked{% endif %}></td><td><input type="checkbox" name="required_{{ field.id }}" {% if field.required %}checked{% endif %}></td><td><input type="number" class="form-control" name="sort_{{ field.id }}" value="{{ field.sort_order }}" min="0"></td></tr>{% endfor %}</tbody></table></div><div class="card-body"><button class="btn btn-primary">Save Settings</button></div></form>{% endblock %}
